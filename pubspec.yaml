name: amuguna
description: "음성 감정 분석 기반 의사결정 도우미 - Kanana-o AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Audio
  record: ^5.2.0
  just_audio: ^0.9.43

  # Network
  http: ^1.2.2

  # Image
  image_picker: ^1.1.2
  image: ^4.3.0

  # Animations
  confetti: ^0.7.0

  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.2

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
